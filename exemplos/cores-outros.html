<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <style>
        /* Bordas */
        .border-example {
            border: 3px solid #3498db;
            padding: 15px;
            margin: 10px 0;
        }

        /* Sombras de texto */
        .text-shadow-example {
            font-size: 32px;
            color: #2c3e50;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Sombras de caixa */
        .box-shadow-example {
            background-color: white;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Outline */
        .outline-example {
            outline: 3px dashed #e74c3c;
            outline-offset: 5px;
            padding: 15px;
            margin: 20px 0;
        }

        /* Bordas múltiplas */
        .multi-border {
            border-top: 4px solid #e74c3c;
            border-right: 4px solid #3498db;
            border-bottom: 4px solid #2ecc71;
            border-left: 4px solid #f39c12;
            padding: 20px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="border-example">
        Elemento com borda colorida: border: 3px solid #3498db;
    </div>

    <div class="text-shadow-example">
        Texto com Sombra
    </div>

    <div class="box-shadow-example">
        Caixa com sombra usando RGBA para transparência
    </div>

    <div class="outline-example">
        Elemento com outline (contorno externo)
    </div>

    <div class="multi-border">
        Bordas com cores diferentes em cada lado
    </div>
</body>

</html>
