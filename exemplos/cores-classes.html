<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <style>
        .red-text {
            color: red;
        }

        .blue-bg {
            background-color: blue;
            color: white;
        }

        .green-box {
            background-color: green;
            padding: 10px;
        }
    </style>
</head>

<body>
    <p class="red-text">Este texto é vermelho</p>
    <p class="blue-bg">Este texto tem fundo azul</p>
    <div class="green-box">Esta caixa tem fundo verde</div>
</body>

</html>
